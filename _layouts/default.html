<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}" />
  <style>
    .lang-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 12px;
      border-radius: var(--radius-full);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      font-family: var(--font-sans, sans-serif);
      transition: all 0.2s ease;
      line-height: 1.5;
    }
    .lang-btn:hover {
      background-color: hsla(145, 22%, 42%, 0.1);
      color: var(--primary-dark);
      border-color: var(--primary);
    }
  </style>
  {% seo %}
  {% feed_meta %}
</head>
<body>

  <!-- 顶部导航 -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="{{ '/' | relative_url }}" class="navbar-brand">
        <svg class="leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
          <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
        </svg>
        {{ site.title }}
      </a>

      <button class="menu-toggle" aria-label="菜单" aria-expanded="false">
        <svg data-icon="menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" x2="20" y1="12" y2="12"/>
          <line x1="4" x2="20" y1="6" y2="6"/>
          <line x1="4" x2="20" y1="18" y2="18"/>
        </svg>
        <svg data-icon="close" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"/>
          <path d="m6 6 12 12"/>
        </svg>
      </button>

      <ul class="navbar-links">
        {% for item in site.nav %}
          <li>
            <a href="{{ item.url | relative_url }}" class="{% if page.url == item.url %}active{% endif %}">
              {{ item.title }}
            </a>
          </li>
        {% endfor %}
        <li class="lang-toggle">
          <button id="langToggle" class="lang-btn" title="切换繁简">简</button>
        </li>
      </ul>
    </div>
  </nav>

  <main>
    {{ content }}
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container-wide footer-inner">
      <div class="footer-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
          <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
        </svg>
        {{ site.title }} · {{ site.tagline }}
      </div>
      <a href="mailto:{{ site.email }}" class="footer-email">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="16" x="2" y="4" rx="2"/>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
        </svg>
        {{ site.email }}
      </a>
      <p class="footer-copy">© {{ 'now' | date: '%Y' }} {{ site.title }}. 保留所有权利.</p>
    </div>
  </footer>

  <!-- 回到顶部按钮 -->
  <button class="back-to-top" aria-label="回到顶部">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m18 15-6-6-6 6"/>
    </svg>
  </button>

  <script src="{{ '/js/main.js' | relative_url }}"></script>

  <!-- 繁简转换脚本 -->
  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
  <script>
  (function() {
    'use strict';

    // 等待 OpenCC 库加载完成
    function waitForOpenCC(callback) {
      if (typeof OpenCC !== 'undefined') {
        callback();
      } else {
        setTimeout(function() { waitForOpenCC(callback); }, 50);
      }
    }

    waitForOpenCC(function() {
      const s2t = OpenCC.Converter({ from: 'cn', to: 'tw' });
      const t2s = OpenCC.Converter({ from: 'tw', to: 'cn' });

      let currentLang = localStorage.getItem('blog_lang') || 'simplified';
      const langBtn = document.getElementById('langToggle');

      function updateButtonText() {
        if (langBtn) {
          langBtn.textContent = currentLang === 'simplified' ? '简' : '繁';
          langBtn.title = currentLang === 'simplified' ? '切换为繁体' : '切换为简体';
        }
      }

      // 递归处理所有文本节点
      function convertTextNodes(node, converter) {
        if (node.nodeType === Node.TEXT_NODE) {
          if (node.nodeValue && node.nodeValue.trim()) {
            node.nodeValue = converter(node.nodeValue);
          }
        } else if (node.nodeType === Node.ELEMENT_NODE) {
          // 跳过 script、style、textarea、input 等元素
          const tag = node.tagName.toLowerCase();
          if (tag === 'script' || tag === 'style' || tag === 'textarea' || tag === 'input' || tag === 'code' || tag === 'pre') {
            return;
          }
          // 跳过语言切换按钮本身
          if (node.id === 'langToggle') {
            return;
          }
          for (let i = 0; i < node.childNodes.length; i++) {
            convertTextNodes(node.childNodes[i], converter);
          }
        }
      }

      function convertPage() {
        const converter = currentLang === 'traditional' ? s2t : t2s;
        convertTextNodes(document.body, converter);
        // 也转换 title
        document.title = converter(document.title);
      }

      if (langBtn) {
        langBtn.addEventListener('click', function() {
          currentLang = currentLang === 'simplified' ? 'traditional' : 'simplified';
          localStorage.setItem('blog_lang', currentLang);
          updateButtonText();
          location.reload();
        });
      }

      updateButtonText();

      if (currentLang === 'traditional') {
        // 等页面完全渲染后再转换
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', convertPage);
        } else {
          convertPage();
        }
      }
    });
  })();
  </script>
</body>
</html>
